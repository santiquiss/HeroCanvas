<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit: the device's safe area is reported (real mode lays the app out with it); interactive-widget: the
         system keyboard covers the page instead of resizing it, as in an app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <title>HeroCanvas</title>
    <!-- Installed on the home screen it opens as an app, in real mode (sim/RealShell). The status bar keeps its own
         strip, in the app's background (theme-color, set by real mode).  -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="pwa/icon-180.png" />
    <link rel="icon" type="image/png" href="/assets/logo-64.png" />
    <meta name="theme-color" content="#e7e9ec" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HeroCanvas" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
